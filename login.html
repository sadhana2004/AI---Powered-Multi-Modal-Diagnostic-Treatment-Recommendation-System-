<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('https://slidechef.net/wp-content/uploads/2023/09/simple-medical-background.jpg');
            background-size: cover;
            font-family: 'Roboto', sans-serif;
            background-color: #ebecee;
            color: #333;
        }
        .navbar {
            background-color: rgb(31, 30, 30);
        }
        .navbar-brand, .nav-link {
            color: #fff !important;
        }
        .login-container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            margin: 80px auto;
        }
        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .form-control {
            border-radius: 50px;
            padding: 12px 20px;
        }
        .btn-primary {
            background-color: #5a67d8;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 16px;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #4c51bf;
        }
        .form-text {
            font-size: 0.9rem;
            color: #6c757d;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="https://cdn-icons-png.flaticon.com/512/2966/2966327.png" alt="Logo" style="width:30px; height:30px; margin-right:10px;">
            Medical Chatbot
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    <div class="container">
        <div class="login-container">
            <h2>Login</h2>
            <form action="/login" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" placeholder="Enter your username" required class="form-control">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required class="form-control">
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <p class="form-text mt-3">Don't have an account? <a href="/signup">Sign up here</a>.</p>
            </form>
        </div>
    </div>
</body>
</html>
